[project]
name = "auto-factory"
version = "0.1.0"
description = "A small computer-use harness for playing Factorio with a vision model"
readme = "README.md"
authors = [
    { name = "Julie Dujardin", email = "julie@dujardin.pw" }
]
requires-python = ">=3.14"
dependencies = [
    "factorio-rcon-py>=2.0.1",
    "langfuse>=5.1.0",
    "mss>=10.1.0",
    "openai>=3.42.0",
    "pynput>=1.8.1",
    "pyobjc-framework-avfoundation>=13.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=13.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-screencapturekit>=13.0 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.0.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[project.scripts]
auto-factory = "auto_factory.harness.cli:main"
auto-factory-game = "auto_factory.control.display:main"
auto-factory-tool = "auto_factory.harness.tool_cli:main"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
